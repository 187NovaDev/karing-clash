  - RULE-SET,💬 OpenAI-ip,🚀 节点选择
  - RULE-SET,♊ Gemini-domain,🚀 节点选择
  - RULE-SET,🐱 GitHub-domain,🚀 节点选择
  - RULE-SET,🐱 GitHub-ip,🚀 节点选择
  - RULE-SET,🎮 游戏平台-domain,🚀 节点选择
  - RULE-SET,🎧 TikTok-domain,🚀 节点选择
  - RULE-SET,📸 Instagram-domain,🚀 节点选择
  - RULE-SET,📹 油管视频-domain,🚀 节点选择
  - RULE-SET,🎥 奈飞视频-domain,🚀 节点选择
  - RULE-SET,🎥 奈飞视频-ip,🚀 节点选择
  - RULE-SET,🌏 国外穿墙-domain,🚀 节点选择
  - RULE-SET,🌏 国外穿墙-ip,🚀 节点选择
  # === 国内直连（必须在走代理之后） ===
  - RULE-SET,Ⓜ️ 微软云盘-domain,DIRECT
  - RULE-SET,🍎 苹果服务-domain,DIRECT
  - RULE-SET,📢 谷歌FCM-domain,DIRECT
  - RULE-SET,📢 谷歌FCM-ip,DIRECT
  - RULE-SET,📺 哔哩哔哩-domain,DIRECT
  - RULE-SET,📺 哔哩哔哩-ip,DIRECT
  - RULE-SET,🎶 网易音乐-domain,DIRECT
  - RULE-SET,🎶 网易音乐-ip,DIRECT
  - RULE-SET,🎯 国内直连-domain,DIRECT
  - RULE-SET,🎯 国内直连-ip,DIRECT
  # === 兜底 ===
  - MATCH,🐟 漏网之鱼
