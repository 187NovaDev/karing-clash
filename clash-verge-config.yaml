rules:
  # === 广告拦截（必须最前） ===
  - RULE-SET,🛑 广告拦截-domain,REJECT
  - RULE-SET,🍃 应用净化-domain,REJECT
  - RULE-SET,🍃 应用净化-ip,REJECT
  # === 走代理 ===
  - RULE-SET,Ⓜ️ 微软Bing-domain,🚀 节点选择
  - RULE-SET,Ⓜ️ 微软服务-domain,🚀 节点选择
  - RULE-SET,🌏 Google-domain,🚀 节点选择
  - RULE-SET,🌏 Google-ip,🚀 节点选择
  - RULE-SET,📲 电报消息-domain,🚀 节点选择
  - RULE-SET,📲 电报消息-ip,🚀 节点选择
